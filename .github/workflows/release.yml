name: release

# Run by hand (Actions > release > Run workflow, or `gh workflow run release`)
# to publish main as a release. It covers every feat, fix or perf commit since
# the last tag, and the next version comes from their commit types.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: next
        run: echo "tag=$(sh .github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
      - if: steps.next.outputs.tag == ''
        run: echo "::notice::no feat, fix or perf commit since the last tag, nothing to release"
      - if: steps.next.outputs.tag != ''
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - if: steps.next.outputs.tag != ''
        run: go test ./...
      - if: steps.next.outputs.tag != ''
        run: |
          git tag "${{ steps.next.outputs.tag }}"
          git push origin "${{ steps.next.outputs.tag }}"
      - if: steps.next.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
